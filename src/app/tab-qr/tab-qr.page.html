<div id="toast-anchor-qr">
  <app-header [currentTab]="Tab.Qr"></app-header>
</div>

<div class="header-and-buttons">
  <h6
    *ngIf="(!utilsService.isSmallDevice  && utilsService.isPortrait) || !utilsService.isNative"
    class="ion-text-center"
  >
    {{ appName }}
  </h6>

  <div class="spinner" *ngIf="showSpinner">
    <ion-spinner color="primary"></ion-spinner>
  </div>

  <ion-card class="qr-buttons-card">
    <ion-card-header
      *ngIf="(!utilsService.isSmallDevice  && utilsService.isPortrait) || !utilsService.isNative"
    >
      <div class="next-step ion-text-center">
        {{ workflowStep | translate }}
      </div>
    </ion-card-header>

    <div class="qr-buttons">
      <div
        class="button-wrapper"
        (click)="handleGenerateButtonClick()"
        (keydown.enter)="handleGenerateButtonClick()"
        (keydown.space)="handleGenerateButtonClick()"
      >
        <ion-button
          expand="block"
          [class.landscape]="!utilsService.isPortrait"
          [class.pseudo-disabled]="isGenerationButtonDisabled"
          [disabled]="isGenerationButtonDisabled"
          (click)="handleGenerateButtonClick(); $event.stopPropagation()"
          (keydown.enter)="handleGenerateButtonClick(); $event.stopPropagation()"
          title="{{ isGenerationButtonDisabled ? '' : ('TOOLTIP_QR-CODE.GENERATE_QR_CODE' | translate) }}"
        >
          {{ 'GENERATE' | translate }}
        </ion-button>
      </div>

      <div
        class="ion-display-flex ion-justify-content-around no-generation-buttons"
        [class.small-screen-hidden]="utilsService.isSmallDevice && !qrService.isQrCodeGenerated"
      >
        <div
          class="button-wrapper"
          (click)="handleSendEmailButtonClick()"
          (keydown.enter)="handleSendEmailButtonClick()"
          (keydown.space)="handleSendEmailButtonClick()"
        >
          <ion-button
            [class.landscape]="!utilsService.isPortrait"
            fill="clear"
            [class.pseudo-disabled]="qrService.qrCodeDownloadLink === '' || hasInputChangedAfterGeneration()"
            [disabled]="qrService.qrCodeDownloadLink === '' || hasInputChangedAfterGeneration()"
            >{{ 'MAIL_QR_CODE' | translate}}</ion-button
          >
        </div>
        <ion-button
          [class.landscape]="!utilsService.isPortrait"
          fill="clear"
          (click)="clearInputField()"
          (keydown.enter)="clearInputField()"
          (keydown.space)="clearInputField()"
          [disabled]="isInputFieldEmpty()"
          >{{ 'CLEAR_INPUT' | translate}}</ion-button
        >
      </div>
    </div>
  </ion-card>
</div>

<ion-content
  class="qr-code-content"
  [class.landscape]="!utilsService.isPortrait"
>
  <ion-card class="qr-card">
    <ion-card-content>
      <ion-item *ngIf="qrService.isQrCodeGenerated" class="no-margin">
        <div class="qr-code no-margin">
          <qrcode
            id="qrcode"
            [qrdata]="qrService.myAngularxQrCode"
            [width]="256"
            [errorCorrectionLevel]="'M'"
            (qrCodeURL)="onChangeURL($event)"
            [allowEmptyString]="true"
          ></qrcode>
        </div>
      </ion-item>

      <ion-item>
        <ion-label position="stacked"
          >{{ 'QR_CODE_TEXT' | translate }}</ion-label
        >
        <ion-textarea
          [style.maxHeight.em]="nbrOfUsedRows * 1.5 + 20"
          [style.minHeight.px]="85"
          [autoGrow]="true"
          [counter]="true"
          #qrDataInput
          placeholder="{{'INPUT_FIELD_PLACEHOLDER' | translate}}"
          [rows]="nbrOfUsedRows"
          maxlength="{{maxInputLength}}"
          (ionInput)="onTextareaInput()"
          (ionBlur)="onQrDataInputBlur()"
        ></ion-textarea>
      </ion-item>
    </ion-card-content>
  </ion-card>
</ion-content>
